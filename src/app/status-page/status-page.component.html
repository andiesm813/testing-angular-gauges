<div class="gauges-page">
  <h4>Gauges &amp; Bulletgraph</h4>


 <div class="gauges-container">


    <section class="gauge-section linear-gauge-section">
      <div class="header">
        <p class="lg-title">Current Temperature</p>
        <p class="lg-value">55</p>
      </div>



        <igx-linear-gauge width="100%" height="44px" [minimumValue]="0" [maximumValue]="100" [value]="64"
          [interval]="100" [labelExtent]="0" font="14px Roboto, sans-serif" 
          [scaleStartExtent]="0.02" [scaleEndExtent]="0.96" scaleBrush="transparent" scaleOutline="transparent"
          tickStartExtent="0.9" tickEndExtent="0" tickStrokeThickness="0" 
          needleShape="Custom" needleBrush="#2E2E30" needleOutline="#fff" needleStrokeThickness="2"
          needleBreadth="48" needleInnerExtent="0.4" needleOuterExtent="2.2"
          needleOuterPointExtent="2.2" needleInnerPointExtent="0.4"
          needleInnerPointWidth="0" needleOuterPointWidth="1"
          needleInnerBaseWidth="0" needleOuterBaseWidth="0">

          <igx-linear-graph-range [startValue]="0" [endValue]="30" brush="#e86e6b" outline="white" outlineThickness="10" 
            [innerStartExtent]="0.3" [innerEndExtent]="0.3" [outerStartExtent]="0.8" [outerEndExtent]="0.8">
          </igx-linear-graph-range>
          <igx-linear-graph-range [startValue]="30" [endValue]="70" brush="#fed663" outline="white" outlineThickness="10"

          </igx-linear-graph-range>
          <igx-linear-graph-range [startValue]="70" [endValue]="100" brush="#84c689" outline="white" outlineThickness="10"

          </igx-linear-graph-range>

          </igx-linear-graph-range>
          <igx-linear-graph-range [startValue]="30" [endValue]="70" brush="#fed663" outline="transparent" outlineThickness="10"
            [innerStartExtent]="0.3" [innerEndExtent]="0.3" [outerStartExtent]="1" [outerEndExtent]="1">
          </igx-linear-graph-range>
          <igx-linear-graph-range [startValue]="70" [endValue]="100" brush="#e6f4e7" outline="transparent" outlineThickness="10"
            [innerStartExtent]="0.3" [innerEndExtent]="0.3" [outerStartExtent]="0.8" [outerEndExtent]="0.8">
          </igx-linear-graph-range>
         
        </igx-linear-gauge>

    </section>
